l_russian:
 aot_curse_of_ymir_modifier: "Проклятие Имир"
 aot_curse_of_ymir_modifier_desc: "Тот, кто унаследовал силу одного из Девяти Титанов, проживёт не более тринадцати лет. Столько же прожила сама Имир после того, как обрела свою силу."
 death_curse_of_ymir: "[Select_CString(CHARACTER.IsFemale, 'умерла', 'умер' )] от Проклятия Имир"

 aot_curse.0002.t: "Последний год"
 aot_curse.0002.desc: "Тринадцать лет почти истекли. Раны затягиваются всё медленнее, по утрам ломит всё тело, а сила титана отзывается слабее, чем прежде.\n\nПроклятию Имир не может противиться никто. Остался год, может быть меньше, — и сила перейдёт к другому."
 aot_curse.0002.a: "Нужно успеть сделать то, что должно."
