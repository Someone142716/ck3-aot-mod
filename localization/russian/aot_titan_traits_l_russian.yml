l_russian:
 trait_aot_founding_titan: "Титан-Прародитель"
 trait_aot_founding_titan_desc: "Сильнейший из Девяти Титанов. Его носителю открыты воспоминания предков и власть над всеми потомками Имир."
 trait_aot_attack_titan: "Атакующий Титан"
 trait_aot_attack_titan_desc: "Атакующий Титан всегда стремился вперёд, к свободе. Его носители видят обрывки воспоминаний тех, кто унаследует силу после них."
 trait_aot_colossal_titan: "Колоссальный Титан"
 trait_aot_colossal_titan_desc: "Шестидесятиметровый гигант, чьё превращение подобно взрыву. Одно его появление способно стереть с лица земли целый город."
 trait_aot_armored_titan: "Бронированный Титан"
 trait_aot_armored_titan_desc: "Тело этого титана покрыто кристаллической бронёй, о которую ломаются клинки и снаряды. Он — щит и таран любой армии."
 trait_aot_female_titan: "Женская Особь"
 trait_aot_female_titan_desc: "Ловкий и универсальный титан, способный отвердевать кожу и криком призывать безмозглых титанов."
 trait_aot_beast_titan: "Звероподобный Титан"
 trait_aot_beast_titan_desc: "Огромный титан, похожий на зверя, мечущий камни с убийственной точностью. Носитель королевской крови может управлять другими титанами."
 trait_aot_cart_titan: "Титан-Перевозчик"
 trait_aot_cart_titan_desc: "Неутомимый четвероногий титан, способный месяцами не покидать облик гиганта и нести на себе людей и снаряжение."
 trait_aot_jaw_titan: "Титан-Челюсти"
 trait_aot_jaw_titan_desc: "Самый быстрый и проворный из Девяти. Его челюсти и когти способны сокрушить даже отвердевшую броню."
 trait_aot_war_hammer_titan: "Титан-Молот Войны"
 trait_aot_war_hammer_titan_desc: "Носитель этой силы творит из отвердевшей плоти оружие, шипы и целые укрепления, управляя титаном на расстоянии."
