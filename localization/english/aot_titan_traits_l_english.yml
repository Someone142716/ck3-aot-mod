l_english:
 trait_aot_founding_titan: "Founding Titan"
 trait_aot_founding_titan_desc: "The mightiest of the Nine. Its inheritor commands the memories of past generations and holds power over all Subjects of Ymir."
 trait_aot_attack_titan: "Attack Titan"
 trait_aot_attack_titan_desc: "The Attack Titan has always fought for freedom. Its inheritors glimpse the memories of those who will hold the power after them."
 trait_aot_colossal_titan: "Colossal Titan"
 trait_aot_colossal_titan_desc: "A sixty-meter giant whose transformation strikes like an explosion. Its mere arrival can wipe a city off the map."
 trait_aot_armored_titan: "Armored Titan"
 trait_aot_armored_titan_desc: "Covered in hardened crystal plates that turn aside blades and shells alike, it is the shield and battering ram of any army."
 trait_aot_female_titan: "Female Titan"
 trait_aot_female_titan_desc: "An agile, versatile titan able to harden its skin and summon mindless titans with a scream."
 trait_aot_beast_titan: "Beast Titan"
 trait_aot_beast_titan_desc: "A huge, bestial titan that hurls stones with deadly accuracy. One of royal blood may even command other titans."
 trait_aot_cart_titan: "Cart Titan"
 trait_aot_cart_titan_desc: "A tireless four-legged titan that can stay transformed for months, carrying soldiers and gear on its back."
 trait_aot_jaw_titan: "Jaw Titan"
 trait_aot_jaw_titan_desc: "The fastest and nimblest of the Nine. Its jaws and claws can crush even hardened armor."
 trait_aot_war_hammer_titan: "War Hammer Titan"
 trait_aot_war_hammer_titan_desc: "Its inheritor shapes hardened flesh into weapons, spikes and entire fortifications, controlling the titan from afar."
