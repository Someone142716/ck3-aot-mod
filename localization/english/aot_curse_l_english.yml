l_english:
 aot_curse_of_ymir_modifier: "Curse of Ymir"
 aot_curse_of_ymir_modifier_desc: "Whoever inherits the power of one of the Nine Titans will live no more than thirteen years — the same span Ymir herself lived after gaining her power."
 death_curse_of_ymir: "died from the Curse of Ymir"

 aot_curse.0002.t: "The Final Year"
 aot_curse.0002.desc: "The thirteen years are nearly over. Wounds close ever more slowly, every morning the body aches, and the titan's power answers more weakly than before.\n\nNo one can defy the Curse of Ymir. A year remains, perhaps less, and then the power will pass to another."
 aot_curse.0002.a: "I must finish what has to be done."
